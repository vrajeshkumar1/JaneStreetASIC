name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Read top module name
        id: top_module
        run: echo "TOP_MODULE=$(yq '.project.top_module' info.yaml)" >> "$GITHUB_OUTPUT"

      - name: Publish the locally hardened GDS
        uses: TinyTapeout/tt-gds-action/custom_gds@ttihp27a
        with:
          pdk: ihp-sg13cmos5l
          top_module: ${{ steps.top_module.outputs.TOP_MODULE }}
          gds_path: local_build/gds/${{ steps.top_module.outputs.TOP_MODULE }}.gds
          lef_path: local_build/lef/${{ steps.top_module.outputs.TOP_MODULE }}.lef
          verilog_path: local_build/nl/${{ steps.top_module.outputs.TOP_MODULE }}.nl.v

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttihp27a

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttihp27a

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttihp27a
